<style>
:root{
  --brand:#f43a0f; --coral:#ef5941; --brown:#633523; --gray:#9b9b9b;
  --ink:#0a0a0a; --ink-2:#4a4a4a; --paper:#f4f4f4; --card:#ffffff; --sand:#ece8e3; --line:#e2ddd7;
  --font:"Helvetica Neue",Helvetica,"Inter Tight",Arial,sans-serif;
  --serif:"Playfair Display",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
.label{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:500}
em.it{font-family:var(--serif);font-style:italic;font-weight:500;letter-spacing:0}
.logo{display:block;height:auto}

/* CAPA */
.cover{padding:20px 0 0}
.card-cover{background:var(--brand);color:#fff;border-radius:26px;padding:28px 28px 30px;position:relative;overflow:hidden;min-height:560px;display:flex;flex-direction:column}
.cover-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.cover-top .logo{width:118px;color:#fff}
.cover-top .label{color:#fff;opacity:.9;text-align:right;line-height:1.7}
.cover h1{font-size:clamp(44px,8.6vw,92px);line-height:.92;font-weight:800;letter-spacing:-.04em;margin-top:auto;padding-top:120px;max-width:13ch;text-transform:none}
.cover .sub{font-size:clamp(16px,2.2vw,19px);margin-top:20px;max-width:46ch;color:#fff;opacity:.95}
.cover-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 24px;margin-top:40px;padding-top:20px;border-top:1px solid rgba(255,255,255,.45)}
.cover-meta .label{font-size:9.5px;color:#fff;opacity:.8}
.cover-meta p{font-size:16px;font-weight:700;margin-top:4px;line-height:1.25}
.sheep{position:absolute;right:22px;bottom:22px;width:46px;height:46px;background:var(--ink);border-radius:6px;display:none}

/* SEÇÕES */
section{padding:64px 0 0}
.sec-label{color:var(--brand)}
h2{font-size:clamp(30px,5vw,46px);line-height:1.02;font-weight:800;letter-spacing:-.03em;margin-top:12px;max-width:20ch}
.lead{color:var(--ink-2);margin-top:14px;max-width:62ch;font-size:17px}

/* VISÃO GERAL */
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.pillar{background:var(--sand);border-radius:20px;padding:22px 22px 26px}
.pillar.dark{background:var(--ink);color:#fff}
.pillar .label{color:var(--brand);font-size:9.5px}
.pillar h3{font-size:22px;line-height:1.08;font-weight:800;letter-spacing:-.02em;margin-top:10px}
.pillar p{font-size:14.5px;color:var(--ink-2);margin-top:10px}
.pillar.dark p{color:#cfcac4}

/* FALA */
.script{margin-top:28px;display:grid;gap:14px}
.act{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 24px 26px;display:grid;grid-template-columns:150px 1fr;gap:20px}
.act .when .label{color:var(--gray);font-size:9.5px}
.act .when h3{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-top:6px}
.act .when .time{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;color:#fff;background:var(--brand);border-radius:999px;padding:3px 10px}
.act blockquote{font-size:clamp(19px,2.6vw,24px);line-height:1.3;font-weight:700;letter-spacing:-.015em}
.act .img{font-size:14.5px;color:var(--ink-2);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.act .img b{color:var(--ink);font-weight:700}
.alts{margin-top:14px;background:var(--ink);color:#fff;border-radius:20px;padding:22px 24px}
.alts .label{color:var(--brand)}
.alts ul{list-style:none;margin-top:10px;display:grid;gap:8px}
.alts li{font-size:16px;color:#e9e4de}
.alts li:before{content:"— ";color:var(--brand)}

/* SHOT LIST */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:28px}
.shot{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.shot .thumbs{display:flex;background:var(--ink);aspect-ratio:9/12;overflow:hidden}
.shot .thumbs img{flex:1;min-width:0;width:100%;height:100%;object-fit:cover;display:block}
.shot .thumbs.none{align-items:center;justify-content:center;color:#777;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.shot .body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:6px}
.shot .top{display:flex;justify-content:space-between;align-items:center}
.shot .num{font-size:24px;font-weight:800;letter-spacing:-.03em;color:var(--brand)}
.shot .ato{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gray)}
.shot h4{font-size:15px;font-weight:700;line-height:1.25}
.shot .k{font-size:13px;color:var(--ink-2)}
.shot .k b{color:var(--ink);font-weight:700}
.shot .src{font-size:11px;color:var(--gray);margin-top:2px}

/* REFERÊNCIAS DE NICHO */
.niche{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:28px}
.ref{background:var(--sand);border-radius:18px;padding:20px 22px}
.ref h4{font-size:17px;font-weight:800;letter-spacing:-.01em}
.ref p{font-size:14px;color:var(--ink-2);margin-top:8px}
.ref .tag{display:inline-block;margin-top:12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brown)}

/* ORDEM DO DIA */
.timeline{margin-top:28px;background:var(--ink);color:#fff;border-radius:24px;padding:10px 26px}
.slot{display:grid;grid-template-columns:130px 1fr;gap:18px;padding:18px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.slot:last-child{border-bottom:0}
.slot .h{font-size:17px;font-weight:800;color:var(--brand);letter-spacing:-.01em}
.slot h4{font-size:16px;font-weight:700}
.slot p{font-size:14px;color:#cfcac4;margin-top:4px}

/* CHECKLIST + FICHA */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 24px}
.box h3{font-size:18px;font-weight:800;letter-spacing:-.01em}
.box ul{list-style:none;margin-top:12px;display:grid;gap:10px}
.box li{font-size:14.5px;color:var(--ink-2);padding-left:22px;position:relative}
.box li:before{content:"";position:absolute;left:0;top:6px;width:11px;height:11px;border:1.5px solid var(--brand);border-radius:3px}
.box dl{margin-top:12px;display:grid;gap:10px}
.box dt{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gray)}
.box dd{font-size:15px;font-weight:700;margin-top:2px}

/* RODAPÉ */
footer{margin-top:72px;background:var(--brand);color:#fff;padding:56px 0 40px}
footer .tag{font-size:clamp(28px,4.6vw,48px);line-height:1.05;font-weight:800;letter-spacing:-.03em;max-width:18ch}
footer .tag em{font-family:var(--serif);font-style:italic;font-weight:500}
footer .logo{width:100%;max-width:980px;color:#fff;margin-top:48px;opacity:1}
footer .micro{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:22px;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
footer a{color:#fff}

@media (max-width:760px){
  .card-cover{min-height:600px;padding:22px}
  .pillars,.two{grid-template-columns:1fr}
  .act{grid-template-columns:1fr;gap:12px}
  .slot{grid-template-columns:1fr;gap:4px}
  .shots{grid-template-columns:repeat(2,1fr);gap:10px}
  .shot .body{padding:12px}
  .shot h4{font-size:14px}
}
@media print{ section{break-inside:avoid} }
</style>
</head>

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const it=s=>esc(s).replace(/\(([^)]+)\)/g,'<em class="it">($1)</em>');
const LOGO=document.getElementById('logo-tpl').innerHTML.replace('<!--','').replace('-->','');
function render(P){
  const h=[];
  h.push(`<header class="cover"><div class="wrap"><div class="card-cover">
    <div class="cover-top">${LOGO}<span class="label">${esc(P.data_doc).replace(' · ','<br>')}</span></div>
    <h1>${it(P.titulo)}</h1><p class="sub">${esc(P.subtitulo)}</p>
    <div class="cover-meta">${P.meta.map(([k,v])=>`<div><span class="label">${esc(k)}</span><p>${esc(v)}</p></div>`).join('')}</div>
  </div></div></header>`);
  h.push(`<section><div class="wrap"><span class="label sec-label">Visão geral</span>
    <h2>${it(P.visao.titulo||"O filme em três ideias.")}</h2><p class="lead">${esc(P.visao.texto)}</p>
    <div class="pillars">${P.visao.pilares.map(([l,t,d],i)=>`<div class="pillar ${i==2?'dark':''}"><span class="label">${esc(l)}</span><h3>${esc(t)}</h3><p>${esc(d)}</p></div>`).join('')}</div>
  </div></section>`);
  if(P.atos.length){
    h.push(`<section><div class="wrap"><span class="label sec-label">Roteiro em três atos</span><h2>${it(P.roteiro_titulo||"O que ele fala e o que a gente mostra.")}</h2>
    ${P.roteiro_intro?`<p class="lead">${esc(P.roteiro_intro)}</p>`:''}
    <div class="script">${P.atos.map(a=>`<div class="act"><div class="when"><span class="label">${esc(a.rotulo)}</span><h3>${esc(a.nome)}</h3><span class="time">${esc(a.tempo)}</span></div>
      <div><blockquote>${esc(a.fala)}</blockquote><p class="img"><b>Imagem:</b> ${esc(a.imagem)}</p></div></div>`).join('')}</div>
    ${P.alternativas.itens.length?`<div class="alts"><span class="label">${esc(P.alternativas.titulo)}</span><ul>${P.alternativas.itens.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    </div></section>`);
  }
  if(P.shots.length){
    h.push(`<section><div class="wrap"><span class="label sec-label">Shot list</span><h2>${it(P.shots_titulo||"Plano a plano, com referência.")}</h2>
    ${P.shots_intro?`<p class="lead">${esc(P.shots_intro)}</p>`:''}
    <div class="shots">${P.shots.map(s=>`<article class="shot">
      ${s.refs&&s.refs.length?`<div class="thumbs">${s.refs.map(r=>`<img loading="lazy" src="${esc(r)}" alt="">`).join('')}</div>`:`<div class="thumbs none">sem referência</div>`}
      <div class="body"><div class="top"><span class="num">${esc(s.n)}</span><span class="ato">${esc(s.ato)}</span></div>
      <h4>${esc(s.titulo)}</h4><p class="k"><b>Plano:</b> ${esc(s.plano)}</p><p class="k"><b>Movimento:</b> ${esc(s.mov)}</p><p class="k"><b>Onde:</b> ${esc(s.onde)}</p>
      ${s.fonte?`<p class="src">Ref.: ${esc(s.fonte)}</p>`:''}</div></article>`).join('')}</div></div></section>`);
  }
  if(P.nicho.length){
    h.push(`<section><div class="wrap"><span class="label sec-label">Referências do nicho</span><h2>${it(P.nicho_titulo||"A linguagem do segmento.")}</h2>
    ${P.nicho_intro?`<p class="lead">${esc(P.nicho_intro)}</p>`:''}
    <div class="niche">${P.nicho.map(r=>`<div class="ref"><h4>${esc(r.titulo)}</h4><p>${esc(r.texto)}</p>${r.tag?`<span class="tag">${esc(r.tag)}</span>`:''}</div>`).join('')}</div></div></section>`);
  }
  if(P.ordem.length){
    h.push(`<section><div class="wrap"><span class="label sec-label">Ordem do dia</span><h2>${it(P.ordem_titulo||"O dia de gravação.")}</h2>
    ${P.ordem_intro?`<p class="lead">${esc(P.ordem_intro)}</p>`:''}
    <div class="timeline">${P.ordem.map(([t,a,b])=>`<div class="slot"><span class="h">${esc(t)}</span><div><h4>${esc(a)}</h4><p>${esc(b)}</p></div></div>`).join('')}</div></div></section>`);
  }
  h.push(`<section><div class="wrap"><span class="label sec-label">Antes de gravar</span><h2>Checklist e ficha.</h2>
    <div class="two"><div class="box"><h3>Checklist</h3><ul>${P.checklist.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="box"><h3>Ficha técnica</h3><dl>${P.ficha.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></div></div>
  </div></section>`);
  h.push(`<footer><div class="wrap"><p class="tag">Contando histórias que a <em>(flecha do tempo)</em> não pode apagar.</p>${LOGO}
    <div class="micro"><span>${esc(P.rodape)}</span><a href="https://www.instagram.com/agnus_films/">@agnus_films</a></div></div></footer>`);
  document.getElementById('app').innerHTML=h.join('');
}
