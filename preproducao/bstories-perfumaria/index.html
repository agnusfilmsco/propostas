<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pré-produção · B.Stories · Agnus Films</title>
<meta property="og:title" content="Pré-produção · B.Stories · Agnus Films">
<meta property="og:description" content="Roteiro de gravação, shot list e ordem do dia.">
<meta property="og:image" content="https://agnusfilmsco.github.io/propostas/preproducao/bstories-perfumaria/media/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&family=Inter+Tight:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#f43a0f; --coral:#ef5941; --brown:#633523; --gray:#9b9b9b;
  --ink:#0a0a0a; --ink-2:#4a4a4a; --paper:#f4f4f4; --card:#ffffff; --sand:#ece8e3; --line:#e2ddd7;
  --font:"Helvetica Neue",Helvetica,"Inter Tight",Arial,sans-serif;
  --serif:"Playfair Display",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.label{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:500}
em.it{font-family:var(--serif);font-style:italic;font-weight:500;letter-spacing:0}
.logo{display:block;height:auto}
button{font:inherit;cursor:pointer}

/* NAV */
.nav{position:sticky;top:0;z-index:20;background:rgba(244,244,244,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transform:translateY(-100%);transition:transform .4s ease;height:52px;margin-bottom:-52px}
.nav.show{transform:none}
.nav .wrap{display:flex;align-items:center;gap:14px;height:52px}
.nav .logo{width:70px;color:var(--brand);flex:none}
.nav .links{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav .links::-webkit-scrollbar{display:none}
.nav a{font-size:12px;color:var(--ink-2);text-decoration:none;white-space:nowrap;letter-spacing:.04em}
.nav .prog{font-size:12px;font-weight:700;color:var(--brand);white-space:nowrap}

/* CAPA */
.cover{padding:20px 0 0}
.card-cover{background:var(--brand);color:#fff;border-radius:26px;padding:28px 28px 30px;position:relative;overflow:hidden;min-height:560px;display:flex;flex-direction:column}
.card-cover:after{content:"";position:absolute;right:-20%;bottom:-60%;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),rgba(255,255,255,0) 65%);animation:glow 9s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{to{transform:translate(-18%,-12%) scale(1.15)}}
.cover-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;position:relative;z-index:1}
.cover-top .logo{width:118px;color:#fff}
.cover-top .label{color:#fff;opacity:.9;text-align:right;line-height:1.7}
.cover h1{font-size:clamp(44px,8.6vw,92px);line-height:.92;font-weight:800;letter-spacing:-.04em;margin-top:auto;padding-top:120px;max-width:13ch;position:relative;z-index:1}
.cover h1 .w{display:inline-block;opacity:0;transform:translateY(40%);animation:up .9s cubic-bezier(.2,.7,.1,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.cover .sub{font-size:clamp(16px,2.2vw,19px);margin-top:20px;max-width:46ch;color:#fff;opacity:.95;position:relative;z-index:1}
.cover-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 24px;margin-top:40px;padding-top:20px;border-top:1px solid rgba(255,255,255,.45);position:relative;z-index:1}
.cover-meta .label{font-size:9.5px;color:#fff;opacity:.8}
.cover-meta p{font-size:16px;font-weight:700;margin-top:4px;line-height:1.25}

/* CRÉDITOS */
.credits{margin-top:14px;background:var(--ink);color:#fff;border-radius:26px;padding:38px 28px 34px;text-align:center}
.credits .pres{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:#a9a39c}
.credits .big{font-size:clamp(22px,3.6vw,34px);font-weight:800;letter-spacing:.02em;text-transform:uppercase;margin-top:6px;line-height:1.1}
.credits .big.talent{color:var(--brand)}
.credits .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 18px;margin-top:30px;padding-top:26px;border-top:1px solid rgba(255,255,255,.14)}
.credits dt{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:#8f8a83}
.credits dd{font-size:15px;font-weight:700;margin-top:6px;text-transform:uppercase;letter-spacing:.04em}
.credits dd.tbd{color:#77716b;font-weight:500;text-transform:none;letter-spacing:0}

/* SEÇÕES */
section{padding:72px 0 0;scroll-margin-top:60px}
.sec-label{color:var(--brand)}
h2{font-size:clamp(30px,5vw,46px);line-height:1.02;font-weight:800;letter-spacing:-.03em;margin-top:12px;max-width:20ch}
.lead{color:var(--ink-2);margin-top:14px;max-width:62ch;font-size:17px}

/* VISÃO GERAL */
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.pillar{background:var(--sand);border-radius:20px;padding:22px 22px 26px}
.pillar.dark{background:var(--ink);color:#fff}
.pillar .label{color:var(--brand);font-size:9.5px}
.pillar h3{font-size:22px;line-height:1.08;font-weight:800;letter-spacing:-.02em;margin-top:10px}
.pillar p{font-size:14.5px;color:var(--ink-2);margin-top:10px}
.pillar.dark p{color:#cfcac4}

/* ROTEIRO */
.script{margin-top:28px;display:grid;gap:14px}
.act{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 24px 26px;display:grid;grid-template-columns:150px 1fr;gap:20px}
.act .when .label{color:var(--gray);font-size:9.5px}
.act .when h3{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-top:6px}
.act .when .time{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;color:#fff;background:var(--brand);border-radius:999px;padding:3px 10px}
.act blockquote{font-size:clamp(19px,2.6vw,24px);line-height:1.3;font-weight:700;letter-spacing:-.015em}
.act .img{font-size:14.5px;color:var(--ink-2);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.act .img b{color:var(--ink);font-weight:700}
.alts{margin-top:14px;background:var(--ink);color:#fff;border-radius:20px;padding:22px 24px}
.alts .label{color:var(--brand)}
.alts ul{list-style:none;margin-top:10px;display:grid;gap:8px}
.alts li{font-size:16px;color:#e9e4de}
.alts li:before{content:"— ";color:var(--brand)}

/* PAINEL DE PROGRESSO */
.panel{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:grid;gap:14px}
.panel .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel .count{font-size:15px;font-weight:700}
.panel .count b{color:var(--brand);font-size:22px;letter-spacing:-.02em}
.bar{height:8px;border-radius:999px;background:#eee9e3;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--brand);border-radius:999px;transition:width .6s cubic-bezier(.2,.7,.1,1)}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#f7f5f2;color:var(--ink-2)}
.fbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.share{font-size:12px;font-weight:700;padding:8px 14px;border-radius:999px;border:0;background:var(--brand);color:#fff}
.share.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line);font-weight:500}
.note{font-size:12px;color:var(--gray)}

/* TAGS */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:0;white-space:nowrap}
.tag:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-pendente{background:#efebe6;color:#7d766f}
.t-gravado{background:var(--brand);color:#fff}
.t-refazer{background:var(--brown);color:#fff}
.t-cliente{background:var(--ink);color:#fff}

/* SHOT LIST */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:20px}
.shot{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .3s,box-shadow .3s}
.shot.st-gravado{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.shot.st-refazer{border-color:var(--brown);box-shadow:0 0 0 1px var(--brown) inset}
.shot.st-cliente{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.shot.hide{display:none}
.shot .thumbs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--ink);aspect-ratio:1/1;overflow:hidden;position:relative}
.shot .thumbs figure{position:relative;overflow:hidden}
.shot .thumbs img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s cubic-bezier(.2,.7,.1,1)}
.shot.in .thumbs img{animation:kb 2.4s cubic-bezier(.2,.7,.1,1)}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
@media (hover:hover){.shot:hover .thumbs img{transform:scale(1.06)}}
.shot .thumbs figcaption{position:absolute;left:6px;bottom:6px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#fff;background:rgba(10,10,10,.72);padding:3px 7px;border-radius:5px}
.shot .thumbs figcaption.n{background:var(--brand)}
.shot .done{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(244,58,15,.6);color:#fff;font-weight:800;font-size:15px;letter-spacing:.2em;text-transform:uppercase;opacity:0;transition:opacity .35s;pointer-events:none}
.shot.st-gravado .done{opacity:1}
.shot .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.shot .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.shot .num{font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--brand);line-height:1}
.shot .ato{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gray)}
.shot h4{font-size:15.5px;font-weight:700;line-height:1.25}
.shot .k{font-size:13px;color:var(--ink-2)}
.shot .k b{color:var(--ink);font-weight:700}
.shot .ap{font-size:13px;color:var(--ink);background:var(--sand);border-radius:10px;padding:9px 11px;margin-top:4px}
.shot .ap b{display:block;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--brown);margin-bottom:3px}
.shot .src{font-size:11px;color:var(--gray)}
.shot .status{display:flex;gap:6px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.shot .status button{transition:background .2s,color .2s,transform .2s}
.shot .status button:not(.on){background:transparent;color:#a8a19a;box-shadow:inset 0 0 0 1px var(--line)}
.t-pendente.on{background:#e2ddd7;color:var(--ink-2)}
.shot .status button:active{transform:scale(.95)}

/* LISTA COMPACTA */
.compact .shots{grid-template-columns:1fr;gap:8px}
.compact .shot{flex-direction:row;border-radius:14px}
.compact .shot .thumbs{width:132px;flex:none;aspect-ratio:auto;min-height:100%}
.compact .shot .thumbs figure:not(:first-child),.compact .shot .k,.compact .shot .ap,.compact .shot .src,.compact .shot .thumbs figcaption{display:none}
.compact .shot .body{padding:10px 12px;gap:4px}
.compact .shot .num{font-size:20px}
.compact .shot h4{font-size:14px}
.compact .shot .plano-c{display:block;font-size:12px;color:var(--ink-2)}
.compact .shot .done{font-size:11px;letter-spacing:.12em}
.compact .shot .status{padding-top:6px;gap:4px}
.compact .shot .status .tag{font-size:9.5px;padding:4px 8px}
.plano-c{display:none}
@media (max-width:760px){.compact .shot .thumbs{width:104px}}

/* VISUALIZAÇÃO AMPLIADA */
.shot .thumbs{cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:40;background:rgba(10,10,10,.97);display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.lb.open{opacity:1;visibility:visible}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;color:#fff;gap:12px}
.lb-top .num{font-size:22px;font-weight:800;color:var(--brand);letter-spacing:-.02em}
.lb-top .ato{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#a9a39c;margin-left:10px}
.lb-x{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;font-size:20px;line-height:1}
.lb-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:0 56px;cursor:zoom-out}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;transform:scale(.96);transition:transform .35s cubic-bezier(.2,.7,.1,1)}
.lb.open .lb-stage img{transform:none}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(10,10,10,.5);color:#fff;font-size:20px}
.lb-prev{left:8px}.lb-next{right:8px}
.lb-info{background:#141414;color:#fff;padding:16px 20px 20px;border-top:1px solid rgba(255,255,255,.08)}
.lb-info .in{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1.2fr 1fr;gap:10px 28px;align-items:start}
.lb-info h4{font-size:18px;font-weight:800;letter-spacing:-.01em;grid-column:1/-1}
.lb-info .k{font-size:13.5px;color:#cfcac4}.lb-info .k b{color:#fff}
.lb-info .ap{font-size:13.5px;color:#e9e4de;background:#1f1f1f;border-radius:10px;padding:10px 12px}
.lb-info .ap b{display:block;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--brand);margin-bottom:3px}
.lb-info .status{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1;margin-top:4px}
.lb-info .status .tag:not(.on){background:transparent;color:#8f8a83;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.lb-hint{font-size:11px;color:#77716b;text-align:center;padding:0 0 10px}
@media (max-width:760px){.lb-stage{padding:0 8px}.lb-nav{top:auto;bottom:10px;transform:none}.lb-info .in{grid-template-columns:1fr}.lb-info{padding:14px 16px 18px;max-height:46vh;overflow:auto}}

/* NICHO */
.niche{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:28px}
.ref{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.ref .pics{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;aspect-ratio:16/10;background:var(--ink)}
.ref .pics img{width:100%;height:100%;object-fit:cover;display:block}
.ref .txt{padding:18px 20px 20px}
.ref h4{font-size:18px;font-weight:800;letter-spacing:-.01em}
.ref p{font-size:14px;color:var(--ink-2);margin-top:8px}
.ref .pl{display:inline-block;margin-top:12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:700}

/* ORDEM DO DIA */
.timeline{margin-top:28px;background:var(--ink);color:#fff;border-radius:24px;padding:10px 26px}
.slot{display:grid;grid-template-columns:130px 1fr;gap:18px;padding:18px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.slot:last-child{border-bottom:0}
.slot .h{font-size:17px;font-weight:800;color:var(--brand);letter-spacing:-.01em}
.slot h4{font-size:16px;font-weight:700}
.slot p{font-size:14px;color:#cfcac4;margin-top:4px}

/* CHECKLIST */
.checks{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:8px 22px}
.chk{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.chk:last-child{border-bottom:0}
.chk input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;border:2px solid var(--brand);border-radius:6px;margin-top:1px;display:grid;place-items:center;transition:background .2s;cursor:pointer}
.chk input:checked{background:var(--brand)}
.chk input:checked:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk span{font-size:15px;color:var(--ink-2);transition:color .2s}
.chk input:checked + span{color:var(--gray);text-decoration:line-through}

/* RODAPÉ */
footer{margin-top:80px;background:var(--brand);color:#fff;padding:56px 0 40px;overflow:hidden}
footer .tag2{font-size:clamp(28px,4.6vw,48px);line-height:1.05;font-weight:800;letter-spacing:-.03em;max-width:18ch}
footer .tag2 em{font-family:var(--serif);font-style:italic;font-weight:500}
footer .logo{width:100%;color:#fff;margin-top:48px}
footer .micro{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:22px;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
footer a{color:#fff}

/* EDIÇÃO */
.editbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px}
.ebtn{font-size:12px;font-weight:700;padding:8px 14px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink)}
.ebtn.on{background:var(--ink);color:#fff}
.ebtn.ghost{border-color:var(--line);color:var(--ink-2);font-weight:500}
.editing [data-k]{outline:1.5px dashed var(--brand);outline-offset:4px;border-radius:4px;cursor:text}
.editing [data-k]:focus{outline-style:solid;background:rgba(244,58,15,.05)}
[data-k].edited:after{content:"editado";display:inline-block;margin-left:8px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--brand);font-weight:700;vertical-align:middle}
.editing [data-k].edited:after{display:none}
.nav .ebtn{padding:6px 12px;font-size:11px}

/* TOAST */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;visibility:hidden;background:var(--ink);color:#fff;font-size:13px;padding:11px 18px;border-radius:999px;transition:transform .35s,opacity .35s,visibility .35s;z-index:30}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}

/* ANIMAÇÃO DE ENTRADA */
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.2,.7,.1,1),transform .9s cubic-bezier(.2,.7,.1,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.shot.in .thumbs img{animation:none}.rv{opacity:1;transform:none;transition:none}.cover h1 .w{animation:none;opacity:1;transform:none}.card-cover:after{animation:none}}

@media (max-width:760px){
  .card-cover{min-height:600px;padding:22px}
  .cover-meta,.credits .grid{grid-template-columns:repeat(2,1fr)}
  .pillars{grid-template-columns:1fr}
  .act{grid-template-columns:1fr;gap:12px}
  .slot{grid-template-columns:1fr;gap:4px}
  .shots{grid-template-columns:1fr}
  .panel .legend{display:none}
}
@media print{.nav,.toast,.share{display:none}.rv{opacity:1;transform:none}}
</style>

function load(){
  try{ const o=JSON.parse(localStorage.getItem(KEY)||"{}"); S={s:o.s||{},c:o.c||{},e:o.e||{}}; }catch(e){}
  const m=location.hash.match(/#st=([^&]+)/);

}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

function paint(){
  let n=0;
  document.querySelectorAll('.shot').forEach(el=>{
    const st=S.s[el.dataset.n]||"pendente"; if(st==="gravado") n++;
    el.classList.remove('st-pendente','st-gravado','st-refazer','st-cliente'); el.classList.add('st-'+st);
    el.querySelectorAll('.status button').forEach(b=>b.classList.toggle('on',b.dataset.s===st));
  });
  const tot=PRE.shots.length, c=document.getElementById('cnt'), b=document.getElementById('bar');
  if(c){ c.textContent=n; b.style.width=(tot?n/tot*100:0)+"%"; }
  document.getElementById('navprog').textContent=tot?`${n}/${tot} gravados`:"";
  document.querySelectorAll('.chk input').forEach(i=>i.checked=!!S.c[i.dataset.c]);
}
function applyEdits(){
  document.querySelectorAll('[data-k]').forEach(el=>{
    if(el.dataset.orig===undefined) el.dataset.orig=el.textContent;
    const v=S.e[el.dataset.k];
    if(v!=null && v!==el.dataset.orig){ el.textContent=v; el.classList.add('edited'); } else { el.textContent=el.dataset.orig; el.classList.remove('edited'); }
  });
}
let EDIT=false;
function setEdit(on){
  EDIT=on; document.body.classList.toggle('editing',on);
  document.querySelectorAll('[data-k]').forEach(el=>{ if(!on){ el.removeAttribute('contenteditable'); return; } try{ el.contentEditable="plaintext-only"; }catch(_){ el.contentEditable="true"; } if(el.contentEditable!=="plaintext-only") el.contentEditable="true"; });
  ['editBtn','editNav'].forEach(id=>{ const b=document.getElementById(id); if(b){ b.classList.toggle('on',on); b.textContent=on?"Concluir":(id==='editNav'?"Editar":"Editar textos"); } });
  if(!on){ save(); applyEdits(); toast("Textos salvos neste aparelho"); }
}
let LB=-1, LBF=0;
function lbShow(i,fig){
  const vis=[...document.querySelectorAll('.shot:not(.hide)')]; if(!vis.length) return;
  LB=(i+vis.length)%vis.length; const el=vis[LB], n=el.dataset.n, s=PRE.shots.find(x=>x.n===n);
  const refs=s.refs||[]; LBF=Math.min(fig||0,Math.max(refs.length-1,0));
  document.getElementById('lbImg').src=refs.length?refs[LBF].src:"";
  const g=k=>{ const e=el.querySelector(`[data-k="shot.${n}.${k}"]`); return e?e.textContent:(s[k]||""); };
  document.getElementById('lbNum').textContent=n; document.getElementById('lbAto').textContent=s.ato||"";
  document.getElementById('lbT').textContent=g('titulo'); document.getElementById('lbPl').textContent=g('plano');
  document.getElementById('lbMv').textContent=g('mov'); document.getElementById('lbOn').textContent=g('onde');
  const ap=g('aparece'); document.getElementById('lbAp').textContent=ap; document.getElementById('lbApW').style.display=ap?"":"none";
  const st=S.s[n]||"pendente";
  document.getElementById('lbSt').innerHTML=STATUS.map(([k,l])=>`<button class="tag t-${k} ${k===st?'on':''}" data-lbs="${k}">${l}</button>`).join('');
  const lb=document.getElementById('lb'); lb.classList.add('open'); lb.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden';
}
function lbClose(){ const lb=document.getElementById('lb'); lb.classList.remove('open'); lb.setAttribute('aria-hidden','true'); document.body.style.overflow=''; LB=-1; }
function applyFilter(){
  const on=document.querySelector('.fbtn.on'); const f=on?on.dataset.f:"todos";
  document.querySelectorAll('.shot').forEach(el=>el.classList.toggle('hide',f!=="todos"&&!el.classList.contains("st-"+f)));
}
function bind(){
  document.addEventListener('click',e=>{
    const th=e.target.closest('.shot .thumbs');
    if(th&&!EDIT){ const vis=[...document.querySelectorAll('.shot:not(.hide)')]; const fig=e.target.closest('figure'); lbShow(vis.indexOf(th.closest('.shot')), fig?[...th.querySelectorAll('figure')].indexOf(fig):0); return; }
    if(e.target.id==="lbPrev"){ lbShow(LB-1); return; }
    if(e.target.id==="lbNext"){ lbShow(LB+1); return; }
    const lbs=e.target.closest('[data-lbs]');
    if(lbs){ const vis=[...document.querySelectorAll('.shot:not(.hide)')]; const n=vis[LB].dataset.n; S.s[n]=lbs.dataset.lbs; save(); paint(); document.querySelectorAll('#lbSt .tag').forEach(t=>t.classList.toggle('on',t===lbs)); return; }
    if(e.target.id==="lbX"||e.target.id==="lbImg"||e.target.id==="lbStage"){ lbClose(); return; }
    const b=e.target.closest('.status button');
    if(b){ const n=b.closest('.shot').dataset.n; S.s[n]=b.dataset.s; save(); paint(); applyFilter(); return; }
    const f=e.target.closest('.fbtn');
    if(f){ document.querySelectorAll('.fbtn').forEach(x=>x.classList.toggle('on',x===f)); applyFilter(); return; }
    if(e.target.id==="viewBtn"){ const on=!document.body.classList.contains('compact'); document.body.classList.toggle('compact',on); e.target.textContent=on?"Cards completos":"Lista compacta"; try{localStorage.setItem(KEY+"-view",on?"c":"f")}catch(_){} return; }
    if(e.target.id==="editBtn"||e.target.id==="editNav"){ setEdit(!EDIT); return; }
    if(e.target.id==="restore"){ if(confirm("Voltar todos os textos para a versão original?")){ S.e={}; save(); applyEdits(); toast("Textos originais restaurados"); } return; }
    if(EDIT&&e.target.closest('.chk')&&e.target.closest('[data-k]')){ e.preventDefault(); return; }
    if(e.target.id==="share"){
      const url=location.origin+location.pathname+"#st="+btoa(encodeURIComponent(JSON.stringify(S)));
      (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast("Link atualizado copiado")).catch(()=>{prompt("Copie o link:",url)});
    }
    if(e.target.id==="reset"){ if(confirm("Zerar o status de todos os planos e do checklist neste aparelho?")){ S.s={}; S.c={}; save(); paint(); applyFilter(); toast("Status zerado"); } }
  });
  document.addEventListener('input',e=>{ const el=e.target.closest('[data-k]'); if(el&&EDIT){ const v=el.textContent; if(v===el.dataset.orig) delete S.e[el.dataset.k]; else S.e[el.dataset.k]=v; save(); } });
  document.addEventListener('keydown',e=>{ if(LB<0) return; if(e.key==="Escape") lbClose(); if(e.key==="ArrowRight") lbShow(LB+1); if(e.key==="ArrowLeft") lbShow(LB-1); });
  let tx=null; const st=document.getElementById('lbStage');
  st.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
  st.addEventListener('touchend',e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>50){ e.preventDefault(); lbShow(LB+(dx<0?1:-1)); } });
  document.addEventListener('keydown',e=>{ if(EDIT&&e.key==="Enter"&&!e.shiftKey&&e.target.closest('[data-k]')){ e.preventDefault(); e.target.blur(); } });
  document.addEventListener('change',e=>{ if(e.target.matches('.chk input')){ S.c[e.target.dataset.c]=e.target.checked; save(); } });
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>es.forEach(x=>{ if(x.isIntersecting){ x.target.classList.add('in'); io.unobserve(x.target); } }),{threshold:.1,rootMargin:"0px 0px -30px 0px"});
    document.querySelectorAll('.rv').forEach(el=>io.observe(el));
    const navEl=document.getElementById('nav');
    new IntersectionObserver(([x])=>navEl.classList.toggle('show',!x.isIntersecting)).observe(document.querySelector('.card-cover'));
  } else document.querySelectorAll('.rv').forEach(el=>el.classList.add('in'));
}

load(); render(PRE); applyEdits(); paint(); bind();
(function(){ let v=null; try{v=localStorage.getItem(KEY+"-view")}catch(_){} const on=v?v==="c":!!PRE.compacto; document.body.classList.toggle('compact',on); const b=document.getElementById('viewBtn'); if(b) b.textContent=on?"Cards completos":"Lista compacta"; })();
if(new URLSearchParams(location.search).has('pdf')) document.querySelectorAll('.rv').forEach(el=>el.classList.add('in'));
</script>
</body>
