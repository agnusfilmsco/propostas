<style>
:root{
  --ink:#1e1e1e; --ink-2:#4a4a4a; --muted:#9b9b9b;
  --paper:#f4f4f4; --card:#ffffff; --line:#e4e4e4;
  --brand:#f43a0f; --rust:#cd4524; --brown:#633523;
  --night:#1e1e1e;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:0 28px}
.label{font-size:11px;letter-spacing:.32em;text-transform:uppercase;font-weight:500}
.logo{display:block;height:auto}

/* HERO */
.hero{background:var(--night);color:#fff;padding:28px 0 72px;position:relative;overflow:hidden}
.hero{border-bottom:4px solid var(--brand)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px}
.topbar .logo{width:120px;color:var(--brand)}
.topbar .label{color:#bdb7ae}
.hero .pre{color:var(--brand);margin-top:88px}
.hero h1{font-size:clamp(48px,9vw,104px);line-height:.95;font-weight:700;letter-spacing:-.035em;margin-top:18px;max-width:12ch}
.hero .proj{font-size:clamp(18px,2.4vw,22px);color:#d9d3ca;margin-top:22px;max-width:40ch}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:56px;padding-top:24px;border-top:1px solid rgba(255,255,255,.14);position:relative;z-index:1}
.meta .label{color:#8f8a83;font-size:10px}
.meta p{margin-top:6px;font-size:14px;color:#fff}

/* SECTIONS */
section{padding:72px 0 0}
.sec-label{color:var(--rust)}
h2{font-size:clamp(28px,4vw,40px);line-height:1.08;font-weight:700;letter-spacing:-.02em;margin-top:14px;max-width:22ch}
.lead p:not(.label){color:var(--ink-2);margin-top:16px;max-width:64ch;font-size:17px}

/* SCOPE */
.scope{margin-top:32px;display:grid;gap:18px}
.block{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.block-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:22px 26px;border-bottom:1px solid var(--line)}
.block-head h3{font-size:19px;font-weight:700;letter-spacing:-.01em}
.block-head h3 span{color:var(--brand);margin-right:8px}
.block-head .sum{font-size:13px;color:var(--muted);text-align:right}
.inc{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:16px 26px;border-bottom:1px solid var(--line)}
.inc .label{color:var(--muted);font-size:10px;margin-right:6px}
.chip{font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:#f7f7f7}
.chip.on{border-color:var(--brand);color:#fff;background:var(--brand)}
.item{padding:20px 26px;border-bottom:1px solid var(--line)}
.item h4{font-size:15px;font-weight:700}
.item p{color:var(--ink-2);font-size:14.5px;margin-top:6px;max-width:68ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;padding:3px 10px;border-radius:6px;background:#efefef;color:var(--ink-2)}
.price{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:16px 26px;border-bottom:1px solid var(--line)}
.price:last-child{border-bottom:0}
.price .n{font-size:15px;font-weight:700}
.price .n small{font-weight:400;color:var(--muted);margin-left:8px;font-size:13px}
.price .v{font-size:20px;font-weight:700;color:var(--brand);white-space:nowrap}

/* INVESTMENT */
.invest{margin-top:32px;background:var(--night);color:#fff;border-radius:22px;padding:34px}
.invest-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.invest-top .label{color:#8f8a83}
.invest-top .label.hl{color:var(--brand)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:24px}
.opt{border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:24px;position:relative}
.opt.best{border:1.5px solid var(--brand);background:transparent}
.opt .badge{position:absolute;top:-11px;left:20px;background:var(--brand);color:#fff;font-size:10px;letter-spacing:.22em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.opt h4{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#d9d3ca;font-weight:500}
.opt .sub{font-size:13px;color:#8f8a83;margin-top:4px}
.opt .old{color:#8f8a83;text-decoration:line-through;font-size:16px;margin-top:18px}
.opt .val{font-size:clamp(34px,5vw,44px);font-weight:700;letter-spacing:-.03em;margin-top:4px;line-height:1}
.opt .val small{font-size:15px;font-weight:400;color:#bdb7ae;letter-spacing:0;margin-left:4px}
.opt .det{font-size:13px;color:#bdb7ae;margin-top:12px}
.opt .det b{color:var(--brand);font-weight:700}
.invest .note{font-size:13px;color:#8f8a83;margin-top:22px;max-width:70ch}

/* TIMELINE */
.steps{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.step .k{font-size:28px;font-weight:700;color:var(--brand);letter-spacing:-.02em;line-height:1}
.step .k small{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px;letter-spacing:0}
.step p{font-size:14px;color:var(--ink-2);margin-top:10px}

/* CONDITIONS */
.conds{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cond{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.cond .label{color:var(--rust);font-size:10px}
.cond p{margin-top:8px;font-size:14.5px;color:var(--ink-2)}
.valid{display:inline-block;margin-top:18px;font-size:13px;padding:7px 14px;border-radius:999px;background:var(--brand);color:#fff}

/* REFERÊNCIAS */
.refs{margin-top:28px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ref{margin:0}
.ref.h{grid-column:1/-1}
.frame{position:relative;border-radius:14px;overflow:hidden;background:#1e1e1e;aspect-ratio:9/16}
.ref.h .frame{aspect-ratio:16/9}
.frame video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.frame video:focus{outline:none}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 80% at 30% 20%,#2c2c2c 0%,#1e1e1e 60%,#151515 100%)}
.ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 2px,transparent 2px 4px)}
.ph .play{width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;position:relative}
.ph .play::after{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px;opacity:.85}
.ph .mark{position:absolute;left:16px;bottom:14px;width:64px;color:var(--brand);opacity:.9}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
a.ph{text-decoration:none;color:#fff;cursor:pointer}
.ph .watch{position:absolute;right:16px;bottom:14px;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#d9d3ca}
a.ph:hover .play{border-color:var(--brand);background:var(--brand)}
.vplay{text-decoration:none;position:absolute;inset:0;border:0;background:none;display:flex;align-items:center;justify-content:center;gap:14px;cursor:pointer;color:#fff;font-family:var(--font)}
.vplay::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#fff 35%,#F43A0F 100%);mix-blend-mode:multiply;pointer-events:none}
.vplay>*{position:relative;z-index:1}
.vplay .play{width:74px;height:74px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .2s}
.vplay .play::after{content:"";border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.vplay:hover .play{transform:scale(1.06)}
.vplay .vlabel{font-size:11px;letter-spacing:.3em;text-transform:uppercase}
@media (max-width:680px){.vplay .play{width:52px;height:52px}.vplay .play::after{border-left-width:13px;border-top-width:8px;border-bottom-width:8px}}
.ref figcaption{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-2);margin-top:10px}

/* CTA */
.cta{padding:88px 0 96px}
.cta-card{background:var(--night);color:#fff;border-radius:24px;padding:64px 32px;text-align:center;position:relative;overflow:hidden}
.cta-card{border-top:4px solid var(--brand)}
.cta-card > *{position:relative}
.cta-card .label{color:var(--brand)}
.cta h2{margin:14px auto 0;max-width:18ch;color:#fff}
.cta p:not(.label){color:#bdb7ae;margin-top:12px}
.btn{display:inline-block;margin-top:28px;background:var(--brand);color:#fff;text-decoration:none;font-size:12px;letter-spacing:.24em;text-transform:uppercase;padding:16px 28px;border-radius:999px;font-weight:500}
.btn:hover{background:var(--rust)}
.contact-line{font-size:13px;color:var(--muted);margin-top:14px}

/* FOOTER */
footer{background:var(--night);color:#8f8a83;padding:48px 0}
.foot .c{text-align:right;font-size:13px;line-height:1.9;margin-top:14px}
.foot .c a,.foot .c span.hl{color:var(--brand);text-decoration:none}
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.foot .logo{width:180px;color:var(--brand)}
.foot .tag-line{font-size:11px;letter-spacing:.32em;text-transform:uppercase;margin-top:16px;color:#d9d3ca}
.foot .r{text-align:right;font-size:11px;letter-spacing:.24em;text-transform:uppercase;line-height:2}

@media (max-width:680px){
  .wrap{padding:0 20px}
  .meta{grid-template-columns:1fr 1fr}
  .conds{grid-template-columns:1fr}
  .block-head{flex-direction:column;gap:4px}
  .block-head .sum{text-align:left}
  .invest{padding:24px}
  .foot .r,.foot .c{text-align:left}
  .refs{gap:8px}
  .ref figcaption{font-size:9px;letter-spacing:.16em}
  .ph .play{width:40px;height:40px}
  .ph .mark{width:44px;left:10px;bottom:10px}
  .cta-card{padding:48px 22px}
  .topbar .label{font-size:9px;letter-spacing:.24em;white-space:nowrap}
  .topbar .logo{width:96px}
}
@media print{
  body{background:#fff}
  section,.block,.invest,.cond,.step{break-inside:avoid}
}
</style>
</head>

  <div class="meta">${P.meta.map(([k,v])=>`<div><span class="label">${esc(k)}</span><p>${esc(v)}</p></div>`).join("")}</div>
</div></header>`;

const projeto = `
<section><div class="wrap lead">
  <p class="label sec-label">O projeto</p>
  <h2>${esc(P.titulo)}</h2>
  ${P.intro.map(t=>`<p>${esc(t)}</p>`).join("")}
</div></section>`;

const escopo = `
<section><div class="wrap">
  <p class="label sec-label">Escopo do projeto</p>
  <div class="scope">${P.escopo.map((b,i)=>`
    <article class="block">
      <div class="block-head"><h3><span>${pad(i+1)}</span>${esc(b.titulo)}</h3><span class="sum">${esc(b.resumo||"")}</span></div>
      ${b.inclui&&b.inclui.length?`<div class="inc"><span class="label">Inclui</span>${b.inclui.map(([t,on])=>`<span class="chip${on?" on":""}">${esc(t)}</span>`).join("")}</div>`:""}
      ${(b.itens||[]).map(it=>`<div class="item"><h4>${esc(it.nome)}</h4><p>${esc(it.desc)}</p>${it.tags?`<div class="tags">${it.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`:""}</div>`).join("")}
      ${(b.precos||[]).map(([n,v,s])=>`<div class="price"><span class="n">${esc(n)}${s?`<small>${esc(s)}</small>`:""}</span><span class="v">${esc(v)}</span></div>`).join("")}
    </article>`).join("")}
  </div>
</div></section>`;

const prazos = P.prazos&&P.prazos.length ? `
<section><div class="wrap">
  <p class="label sec-label">Prazos de entrega</p>
  <div class="steps">${P.prazos.map(([k,u,t])=>`<div class="step"><div class="k">${esc(k)}<small>${esc(u)}</small></div><p>${esc(t)}</p></div>`).join("")}</div>
</div></section>` : "";

const I = P.investimento;
const invest = `
<section><div class="wrap">
  <div class="invest">
    <div class="invest-top"><span class="label hl">${esc(I.titulo)}</span><span class="label">${esc(I.lateral||"")}</span></div>
    <div class="opts">${I.opcoes.map(o=>`
      <div class="opt${o.destaque?" best":""}">
        ${o.destaque?`<span class="badge">${esc(o.destaque)}</span>`:""}
        <h4>${esc(o.titulo)}</h4><p class="sub">${esc(o.sub||"")}</p>
        ${o.de?`<p class="old">${esc(o.de)}</p>`:""}
        <p class="val"${o.de?"":` style="margin-top:22px"`}>${esc(o.valor)}<small>${esc(o.sufixo||"")}</small></p>
        ${o.det?`<p class="det">${o.det}</p>`:""}
      </div>`).join("")}
    </div>
    ${I.nota?`<p class="note">${esc(I.nota)}</p>`:""}
  </div>
</div></section>`;

const R = P.referencias;
const CAN_EMBED = location.protocol.startsWith("http") && !/claude|anthropic/i.test(location.hostname);
function frameHTML(v){
  if (v.vimeo) {
    const link = v.link || `https://vimeo.com/${v.vimeo}${v.hash?"/"+v.hash:""}`;
    if (CAN_EMBED) return `<iframe src="https://player.vimeo.com/video/${esc(v.vimeo)}?${v.hash?"h="+esc(v.hash)+"&":""}title=0&byline=0&portrait=0&color=f43a0f" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="${esc(v.legenda)}"></iframe>`;
    return `<a class="ph" href="${esc(link)}" target="_blank" rel="noopener"><span class="play"></span>${MARK}<span class="watch">Assistir no Vimeo</span></a>`;
  }
  if (v.src) return `<video src="${esc(v.src)}"${v.poster?` poster="${esc(v.poster)}"`:""} playsinline preload="metadata"></video><a class="vplay" href="${esc(v.link||"#")}" aria-label="Assistir ${esc(v.legenda)}" onclick="event.preventDefault();const vd=this.previousElementSibling;vd.controls=true;vd.play().catch(()=>{});this.remove();"><span class="play"></span><span class="vlabel">Assistir</span></a>`;
  return `<div class="ph"><span class="play"></span>${MARK}</div>`;
}
const MARK = LOGO.replace('class="logo"','class="mark"');
const refs = R && R.videos && R.videos.length ? `
<section><div class="wrap lead">
  <p class="label sec-label">Referências · Feito pela Agnus</p>
  <h2>${esc(R.titulo)}</h2>
  ${R.texto?`<p>${esc(R.texto)}</p>`:""}
  <div class="refs">${R.videos.map(v=>`
    <figure class="ref ${v.formato==="h"?"h":"v"}">
      <div class="frame"${v.ratio?` style="aspect-ratio:${esc(v.ratio)}"`:""}>${frameHTML(v)}</div>
      <figcaption>${esc(v.legenda)}</figcaption>
    </figure>`).join("")}
  </div>
</div></section>` : "";

const conds = `
<section><div class="wrap">
  <p class="label sec-label">Condições</p>
  <div class="conds">${P.condicoes.map(([k,v])=>`<div class="cond"><span class="label">${esc(k)}</span><p>${esc(v)}</p></div>`).join("")}</div>
  <span class="valid">${esc(P.validade)}</span>
</div></section>`;

const C = P.cta;
const cta = `
<section class="cta"><div class="wrap"><div class="cta-card">
  <p class="label">Próximo passo</p>
  <h2>${esc(C.titulo)}</h2>
  <p>${esc(C.sub)}</p>
  <a class="btn" href="${C.link?esc(C.link):(C.whatsapp?`https://wa.me/${esc(C.whatsapp)}?text=${encodeURIComponent("Olá! Quero seguir com a proposta "+P.ref+" da Agnus.")}`:"#")}" target="_blank" rel="noopener">${esc(C.botao)}</a>
</div></div></section>`;

const footer = `
<footer><div class="wrap foot">
  <div>${LOGO}<p class="tag-line">Eternizando instantes em memórias</p></div>
  <div><div class="r">The Story Company<br>Produtora audiovisual<br>Brasília // BSB // Brasil</div>
  ${(C.contato||C.site)?`<div class="c">${esc(C.cidade||"")}<br><span class="hl">${[C.contato?(C.link?`<a href="${esc(C.link)}" target="_blank" rel="noopener">${esc(C.contato)}</a>`:esc(C.contato)):"",C.site?esc(C.site):""].filter(Boolean).join(" · ")}</span></div>`:""}</div>
</div></footer>`;

document.getElementById("app").innerHTML = hero + projeto + escopo + prazos + invest + refs + conds + cta + footer;
document.title = `Proposta · ${P.cliente} · Agnus Films`;
</script>
</body>
</html>
